<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Luyện Kanji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
/* Layout: one centered workspace (max 1040px). Setup = kanji picker beside an options panel; quiz = huge glyph beside the answer fields; stats = sortable table. Dark-first, black ground like Tofugu, one pink accent. */
:root {
  --bg: #0d0d0f;
  --surface: #161619;
  --surface-2: #1f1f24;
  --line: #2b2b32;
  --fg: #f2f1ee;
  --muted: #9b99a3;
  --accent: #ee5a9a;
  --on-accent: #1a0711;
  --good: #4cc38a;
  --good-bg: #11271e;
  --bad: #ff7a5c;
  --bad-bg: #2d1912;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-kanji: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f5f2; --surface: #ffffff; --surface-2: #efece8; --line: #dcd8d2;
    --fg: #17161a; --muted: #6a6772; --accent: #c92f78; --on-accent: #ffffff;
    --good: #1c8a55; --good-bg: #e3f4ea; --bad: #c4452a; --bad-bg: #fbe6df;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f7f5f2; --surface: #ffffff; --surface-2: #efece8; --line: #dcd8d2;
  --fg: #17161a; --muted: #6a6772; --accent: #c92f78; --on-accent: #ffffff;
  --good: #1c8a55; --good-bg: #e3f4ea; --bad: #c4452a; --bad-bg: #fbe6df;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[lang="ja"] { font-family: var(--font-kanji); }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-bottom: 18px; margin-bottom: 28px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand .mark { font-family: var(--font-kanji); color: var(--accent); font-size: 28px; line-height: 1; }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav button:hover { color: var(--fg); }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--fg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
.lede { color: var(--muted); max-width: 60ch; margin-top: 8px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.btn {
  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px;
  padding: 12px 22px; font-weight: 600; font-size: 15px;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.ghost:hover { border-color: var(--muted); filter: none; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }

/* setup */
.setup-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; margin-top: 28px; align-items: start; }
.pick { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.group-head h2 { font-size: 15px; }
.group-head .n { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.chip {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--muted);
}
.chip .k { font-family: var(--font-kanji); font-size: 30px; line-height: 1.2; }
.chip .h { font-size: 11px; letter-spacing: .06em; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); color: var(--fg); }
.opts { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 18px; }
.opts label.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.opts input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.opts .sub { color: var(--muted); font-size: 13px; }
.opts .btn { width: 100%; }
.warn { color: var(--bad); font-size: 13px; min-height: 1.2em; }

/* quiz */
.qbar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.qbar .count { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 64px; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s ease; }
.qcard { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 32px; padding: 32px; }
.glyph {
  font-family: var(--font-kanji); font-weight: 700; font-size: clamp(112px, 20vw, 190px); line-height: 1.15;
  text-align: center; display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); border-radius: 12px; min-height: 240px;
}
.qform { display: flex; flex-direction: column; gap: 18px; min-width: 0; justify-content: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .lbl { font-weight: 600; }
.field .lbl small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.field input {
  font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 10px; min-width: 0; width: 100%;
  background: var(--surface-2); color: var(--fg); border: 1.5px solid var(--line);
}
.field input:focus { outline: none; border-color: var(--accent); }
.field input:disabled { opacity: 1; -webkit-text-fill-color: var(--fg); }
.field.ok input { border-color: var(--good); background: var(--good-bg); }
.field.no input { border-color: var(--bad); background: var(--bad-bg); }
.kana { min-height: 1.5em; color: var(--muted); font-family: var(--font-kanji); font-size: 16px; }
.verdict { font-size: 14px; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.qactions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.qactions .hint { color: var(--muted); font-size: 13px; }
.fb { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; }
.fb h3 { font-size: 20px; letter-spacing: .02em; }
.fb .vi { color: var(--muted); margin-top: 2px; }
.rd { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 12px; }
.rd dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
.rd dd { margin: 0; font-family: var(--font-kanji); font-size: 17px; }
.words { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.word { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.word b { font-family: var(--font-kanji); font-weight: 500; color: var(--fg); font-size: 16px; margin-right: 6px; }

/* results */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .big { font-size: 64px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.score .pct { color: var(--muted); font-size: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.wrong-list { display: flex; flex-direction: column; margin-top: 20px; }
.wrong { display: grid; grid-template-columns: minmax(64px, auto) minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
.wrong .k { font-family: var(--font-kanji); font-size: 40px; text-align: center; line-height: 1.1; }
.wrong .ans { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.wrong .ans .muted { color: var(--muted); }
.bad-text { color: var(--bad); }
.good-text { color: var(--good); }
.empty { color: var(--muted); margin-top: 16px; }

/* stats */
.stat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sums { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 12px; }
.sums div { display: flex; flex-direction: column; }
.sums b { font-size: 26px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.sums span { color: var(--muted); font-size: 13px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.kj { font-family: var(--font-kanji); font-size: 28px; line-height: 1.1; min-width: 70px; white-space: nowrap; }
td .sm { color: var(--muted); font-size: 13px; display: block; }
.acc { display: flex; align-items: center; gap: 10px; }
.acc .bar { width: 90px; flex: none; }
.acc .bar i { background: var(--good); }
.acc .bar.low i { background: var(--bad); }
.unpracticed { color: var(--muted); margin-top: 14px; font-size: 13px; }

/* tabs, word categories, word cards */
.tabs { display: flex; gap: 4px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 16px; color: var(--muted); font-weight: 500; margin-bottom: -1px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .tn { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.catcard { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--muted); }
.catcard .cn { color: var(--fg); font-weight: 600; }
.catcard .ce { font-family: var(--font-kanji); font-size: 18px; color: var(--fg); }
.catcard .cm { font-size: 12px; }
.catcard[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }
.catcard[aria-pressed="false"] .cn, .catcard[aria-pressed="false"] .ce { color: var(--muted); }
.opts select { font: inherit; padding: 9px 10px; border-radius: 8px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); width: 100%; margin-top: 8px; }
.glyph { flex-direction: column; }
.glyph[data-len="2"] { font-size: clamp(72px, 13vw, 128px); }
.glyph[data-len="3"] { font-size: clamp(56px, 10vw, 96px); }
.glyph[data-len="4"] { font-size: clamp(44px, 8vw, 76px); }
.glyph[data-len="5"], .glyph[data-len="6"], .glyph[data-len="7"] { font-size: clamp(36px, 6.5vw, 60px); }
.gcat { font-family: var(--font-ui); font-weight: 500; font-size: 13px; line-height: 1.4; letter-spacing: .04em; color: var(--muted); margin-top: 12px; text-align: center; padding-inline: 12px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.irr { color: var(--bad); border-color: var(--bad); }
.note { color: var(--muted); font-size: 14px; margin-top: 12px; max-width: 60ch; }

@media (max-width: 760px) {
  .setup-grid { grid-template-columns: minmax(0, 1fr); }
  .opts { position: static; }
  .qcard { grid-template-columns: minmax(0, 1fr); padding: 20px; gap: 20px; }
  .glyph { min-height: 180px; }
  .fb { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="app">

    <nav class="nav" aria-label="Điều hướng">
      <button type="button" data-act="goto" data-v="setup" id="nav-setup">Luyện tập</button>
      <button type="button" data-act="goto" data-v="stats" id="nav-stats">Thống kê</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

function moneyMean(v, yen) {
  const base = numForms(v).slice(), q = v / 100, t = v / 1000;
  if (v < 1000 && v % 100 === 0 && NV[q]) base.push(q + ' trăm', NV[q] + ' trăm');
  else if (v >= 1000 && v < 10000 && v % 1000 === 0 && NV[t]) base.push(t + ' nghìn', NV[t] + ' nghìn', t + ' ngàn', NV[t] + ' ngàn');
  else if (v === 10000) base.push('mười nghìn', '10 nghìn', 'mười ngàn', 'một vạn', '1 vạn');
  else if (v === 100000) base.push('một trăm nghìn', '100 nghìn', 'mười vạn');
  else if (v === 1000000) base.push('một triệu', '1 triệu');
  const nice = numForms(v).slice(-1)[0] + (yen ? ' yên' : '');
  const all = yen ? base.concat(base.map(x => x + ' yên')) : base;
  return { mean: [nice].concat(all.filter(x => x !== nice)), vi: nice };
}

/* ---------- romaji -> hiragana ---------- */
const T = (() => {
  const t = {};
  const rows = { '': 'あいうえお', k: 'かきくけこ', s: 'さしすせそ', t: 'たちつてと', n: 'なにぬねの', h: 'はひふへほ', m: 'まみむめも',
    r: 'らりるれろ', g: 'がぎぐげご', z: 'ざじずぜぞ', d: 'だぢづでど', b: 'ばびぶべぼ', p: 'ぱぴぷぺぽ' };
  for (const c in rows) 'aiueo'.split('').forEach((v, j) => { t[c + v] = rows[c][j]; });
  t.ya = 'や'; t.yu = 'ゆ'; t.yo = 'よ'; t.wa = 'わ'; t.wo = 'を';
  Object.assign(t, { shi: 'し', chi: 'ち', tsu: 'つ', fu: 'ふ', ji: 'じ' });
  const yoon = { k: 'き', g: 'ぎ', n: 'に', h: 'ひ', m: 'み', r: 'り', b: 'び', p: 'ぴ' };
  for (const c in yoon) { t[c + 'ya'] = yoon[c] + 'ゃ'; t[c + 'yu'] = yoon[c] + 'ゅ'; t[c + 'yo'] = yoon[c] + 'ょ'; }
  const yo2 = { sh: 'し', sy: 'し', ch: 'ち', ty: 'ち', cy: 'ち', j: 'じ', jy: 'じ', zy: 'じ', dy: 'ぢ' };
  for (const c in yo2) { t[c + 'a'] = yo2[c] + 'ゃ'; t[c + 'u'] = yo2[c] + 'ゅ'; t[c + 'o'] = yo2[c] + 'ょ'; }
  t.xtu = 'っ'; t.ltu = 'っ'; t.xtsu = 'っ'; t.ltsu = 'っ';
  return t;
})();
const VOW = 'aiueo';
function kataToHira(s) { return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function toKana(input, final) {
  const s = kataToHira(String(input).normalize('NFC').toLowerCase()).replace(/[\s　・\-ー]/g, '');
  let out = '', i = 0;
  while (i < s.length) {
    const c = s[i], n1 = s[i + 1];
    if (c === "'") { i++; continue; }
    if (!/[a-z]/.test(c)) { out += c; i++; continue; }
    if (c === 'n') {
      if (n1 === undefined) { out += final ? 'ん' : 'n'; i++; continue; }
      if (n1 === "'") { out += 'ん'; i += 2; continue; }
      if (n1 === 'n') {
        const n2 = s[i + 2];
        if (n2 !== undefined && (VOW.includes(n2) || n2 === 'y')) { out += 'ん'; i += 1; continue; }
        out += 'ん'; i += 2; continue;
      }
      if (!VOW.includes(n1) && n1 !== 'y') { out += 'ん'; i += 1; continue; }
    }
    if (n1 !== undefined && c === n1 && !VOW.includes(c) && c !== 'n') { out += 'っ'; i++; continue; }
    if (c === 't' && s.substr(i + 1, 2) === 'ch') { out += 'っ'; i++; continue; }
    let hit = false;
    for (let len = 3; len >= 1; len--) {
      const sub = s.substr(i, len);
      if (T[sub]) { out += T[sub]; i += len; hit = true; break; }
    }
    if (!hit) { out += c; i++; }
  }
  return out;
}
function matchReading(k, input) {
  const v = toKana(input, true);
  return v.length > 0 && k.read.includes(v);
}

/* ---------- nghĩa / Hán Việt ---------- */
function stripD(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
function normM(s) {
  return String(s).normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}\p{M}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
}
// Gõ không dấu thì so không phân biệt dấu. Gõ có dấu thì dấu phải đúng (nhất ≠ nhật).
function matchMeaning(k, input) {
  const toks = String(input).split(/[,;\/]/).map(normM).filter(Boolean);
  if (!toks.length) return false;
  const acc = k.mean.map(normM);
  const accS = acc.map(stripD);
  return toks.every(t => {
    const ts = stripD(t);
    return ts !== t ? acc.includes(t) : accS.includes(ts);
  });
}

        <button type="button" class="btn" data-act="practice-weak" ${weak ? '' : 'disabled'}>Luyện ${weak} chữ hay sai</button>
        ${state.confirmReset
          ? '<button type="button" class="btn danger" data-act="reset-stats">Xóa hẳn thống kê</button><button type="button" class="btn ghost" data-act="cancel-reset">Giữ lại</button>'
          : '<button type="button" class="btn ghost" data-act="confirm-reset" ' + (rows.length ? '' : 'disabled') + '>Xóa thống kê</button>'}
      </div>
    </div>
    ${rows.length ? `<div class="table-wrap"><table>
      <thead><tr><th></th><th>Chữ</th><th>Sai cách đọc</th><th>Sai nghĩa</th><th>Tỉ lệ đúng</th></tr></thead>
      <tbody>${body}</tbody></table></div>
      ${never ? `<p class="unpracticed">${never} chữ chưa được hỏi lần nào.</p>` : ''}`
      : '<p class="empty">Chưa có dữ liệu. Làm một lượt luyện tập, chữ nào sai sẽ hiện ở đây, xếp từ sai nhiều nhất.</p>'}
  </section>`;
}

/* ---------- vẽ và điều khiển ---------- */
let focusId = null;
function render() {
  $('#nav-setup').setAttribute('aria-current', state.view === 'setup' ? 'page' : 'false');
  $('#nav-stats').setAttribute('aria-current', state.view === 'stats' ? 'page' : 'false');
  const v = { setup: viewSetup, quiz: viewQuiz, results: viewResults, stats: viewStats }[state.view];
  $('#view').innerHTML = v();
  if (state.view === 'quiz') {
    if (state.phase === 'ask') ($('#in-read') || $('#in-mean'))?.focus();
    else $('#next')?.focus();
  } else if (focusId) { document.getElementById(focusId)?.focus(); }
  focusId = null;
}
function startQuiz(list) {
  state.mode = { read: state.read, mean: state.mean };
  state.queue = shuffle(list.slice()); state.i = 0; state.phase = 'ask'; state.cur = null; state.log = []; state.view = 'quiz';
  window.scrollTo(0, 0); render();
}
function submitAnswer() {
  const k = state.queue[state.i];
  const rIn = state.mode.read ? ($('#in-read')?.value ?? '') : '';
  const mIn = state.mode.mean ? ($('#in-mean')?.value ?? '') : '';
  const a = { k, rIn, mIn, askR: state.mode.read, askM: state.mode.mean,
    rOk: state.mode.read ? matchReading(k, rIn) : true, mOk: state.mode.mean ? matchMeaning(k, mIn) : true };
  state.cur = a; state.log.push(a);
  const s = stats[k.id] || (stats[k.id] = { rn: 0, rw: 0, mn: 0, mw: 0 });
  if (a.askR) { s.rn++; if (!a.rOk) s.rw++; }
  if (a.askM) { s.mn++; if (!a.mOk) s.mw++; }
  saveStats();
  state.phase = 'review'; render();
}
function nextQ() {
  state.i++;
  if (state.i >= state.queue.length) { state.view = 'results'; window.scrollTo(0, 0); }
  else state.phase = 'ask';
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'toggle-chip') { const k = el.dataset.k; state.sel.has(k) ? state.sel.delete(k) : state.sel.add(k); focusId = el.id; render(); }
  else if (act === 'toggle-group') {
    const items = KANJI.filter(k => k.g === +el.dataset.g), all = items.every(k => state.sel.has(k.k));
    items.forEach(k => all ? state.sel.delete(k.k) : state.sel.add(k.k)); focusId = el.id; render();
  }
  else if (act === 'start') { startQuiz(KANJI.filter(k => state.sel.has(k.k))); }
  else if (act === 'tab') { state.tab = el.dataset.t; focusId = el.id; render(); }
  else if (act === 'toggle-cat') { const c = el.dataset.c; state.wsel.has(c) ? state.wsel.delete(c) : state.wsel.add(c); focusId = el.id; render(); }
  else if (act === 'all-cats') { WCATS.every(c => state.wsel.has(c.id)) ? state.wsel.clear() : WCATS.forEach(c => state.wsel.add(c.id)); focusId = el.id; render(); }
  else if (act === 'start-words') { const p = shuffle(poolW().slice()); startQuiz(state.limit ? p.slice(0, state.limit) : p); }
  else if (act === 'check') submitAnswer();
  else if (act === 'next') nextQ();
  else if (act === 'quit') { state.view = 'setup'; render(); }
  else if (act === 'goto') { state.view = el.dataset.v; state.confirmReset = false; window.scrollTo(0, 0); render(); }
  else if (act === 'retry-wrong') startQuiz(state.log.filter(a => !isOk(a)).map(a => a.k));
  else if (act === 'retry-all') startQuiz(state.log.map(a => a.k));
  else if (act === 'practice-weak') startQuiz(ALL.filter(k => { const s = stats[k.id]; return s && s.rw + s.mw > 0; }));
  else if (act === 'confirm-reset') { state.confirmReset = true; render(); }
  else if (act === 'cancel-reset') { state.confirmReset = false; render(); }
  else if (act === 'reset-stats') { stats = {}; saveStats(); state.confirmReset = false; render(); }
});
document.addEventListener('change', e => {
  const t = e.target, o = t.dataset?.opt; if (!o) return;
  if (o === 'read' || o === 'mean') state[o] = t.checked;
  else if (o === 'irr') state.irr = t.checked;
  else if (o === 'limit') state.limit = +t.value;
  focusId = t.id || null; render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'in-read') {
    const v = e.target.value; $('#kana-prev').textContent = v ? '→ ' + toKana(v, false) : '';
  }
});
document.addEventListener('keydown', e => {
  if (state.view !== 'quiz' || e.key !== 'Enter' || e.isComposing) return;
  if (state.phase === 'ask' && e.target.matches('input')) { e.preventDefault(); submitAnswer(); }
  else if (state.phase === 'review' && e.target === document.body) { e.preventDefault(); nextQ(); }
});
render();
</script>

</body></html>
